<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Secure payment · Ngao Sports</title><link rel="stylesheet" href="assets/payment.css"></head>
<body><main class="card"><a class="brand" href="index.html">NGAO SPORTS</a><h1>Complete your payment</h1><p>You'll be transferred to Paystack's secure checkout to choose your payment method.</p><form id="payment-form"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><label for="amount">Amount (KES)</label><input id="amount" name="amount" type="number" min="1" step="0.01" inputmode="decimal" required><button id="pay-button" type="submit">Pay now</button><p id="message" class="message" role="status"></p></form></main>
<script>
  // Leave blank when these files are served by Django. For a separate static
  // host, replace this with your HTTPS Django API origin (no trailing slash).
  const API_BASE = window.PAYMENT_API_BASE || 'https://admin.ngaosports.com' || 'http://127.0.0.1:8000';
  const form = document.getElementById('payment-form');
  const button = document.getElementById('pay-button');
  const message = document.getElementById('message');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!form.reportValidity()) return;
    button.disabled = true; button.textContent = 'Processing…'; message.textContent = '';
    try {
      const response = await fetch(`${API_BASE}/api/payments/initialize/`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: form.email.value, amount: form.amount.value}),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'Could not start payment.');
      window.location.href = data.authorization_url;
    } catch (error) {
      message.textContent = error.message; message.className = 'message error';
      button.disabled = false; button.textContent = 'Pay now';
    }
  });
</script></body></html>
