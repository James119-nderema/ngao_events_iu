<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verifying payment · Ngao Sports</title><link rel="stylesheet" href="assets/payment.css"></head>
<body><main class="card"><a class="brand" href="index.html">NGAO SPORTS</a><h1 id="title">Verifying your payment</h1><p id="message" class="message" role="status">Please wait while we confirm your transaction.</p><a id="return-link" class="back" href="index.html">Return home</a></main>
<script>
  // Must match payment.html and PAYSTACK_CALLBACK_URL in Django settings.
  const API_BASE = window.PAYMENT_API_BASE || 'https://admin.ngaosports.com' || 'http://127.0.0.1:8000';
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  const reference = new URLSearchParams(window.location.search).get('reference');
  async function verify() {
    if (!reference) { title.textContent = 'Payment reference missing'; message.textContent = 'We could not verify this payment.'; message.className = 'message error'; return; }
    try {
      const response = await fetch(`${API_BASE}/api/payments/verify/${encodeURIComponent(reference)}/`);
      const data = await response.json();
      if (!response.ok || !data.verified) throw new Error(data.detail || 'Payment has not been confirmed yet.');
      title.textContent = 'Payment successful'; message.textContent = `Your payment (${data.reference}) has been confirmed.`; message.className = 'message success';
    } catch (error) { title.textContent = 'Payment not confirmed'; message.textContent = error.message; message.className = 'message error'; }
  }
  verify();
</script></body></html>
